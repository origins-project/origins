name: site

# The site is built on every push, so that a broken page shows on the branch that broke
# it, and published from master alone.
on:
  push:
    branches: ['**']

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json

      # The theme imports the wordmark and the colours from web/, and the site's build
      # builds the application first, since the demo it exports from the git fixture
      # is the application embedded in origins.
      - run: npm --prefix web ci
      - run: tools/mkgitfixture.sh

      - run: npm --prefix site ci
      - run: npm --prefix site run build

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/master'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
